# The collector that publishes clubs.json also carries an old copy of
# index.html in memory, and its recovery path writes that copy back over
# whatever the repository holds — so a page fix pushed from anywhere else
# lasted ten minutes. The fixed publish.js is on main and on the collector's
# disk, but the running process predates it and cannot be reached from here.
#
# Until that process is restarted, this puts the page back within a minute
# of each reversion. It touches index.html and nothing else — clubs.json and
# status.json are collected data and pass through untouched. Once the
# restarted collector stops reverting, every run is a no-op, and the file
# can be deleted along with .github/canonical-index.html.
name: keep-page
on:
  push:
    branches: [main]
    paths: ['index.html']
permissions:
  contents: write
concurrency:
  group: keep-page
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: put the current page back if an older machine republished its copy
        run: |
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            grep -q 'page-rev: coverage-v3' index.html && exit 0
            cp .github/canonical-index.html index.html
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'page: restore coverage-v3 over an older republished copy'
            git push && exit 0
            sleep 15
          done
          exit 1
